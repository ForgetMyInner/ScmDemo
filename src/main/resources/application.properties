spring.application.name=scm-demo

# 应用服务 WEB 访问端口
server.port=8080
#配置链接数据库
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/scm_db?serverTimezone=Asia/Shanghai&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=123456

#映射文件位置，默认为classpath*:/mapper/**/*.xml
#mybatis-plus.mapper-locations=classpath*:/mapper/**/*.xml
#主键的生成策略
mybatis-plus.global-config.db-config.id-type=auto
#逻辑删除字段
mybatis-plus.global-config.db-config.logic-delete-field=enable
#逻辑非删除值 默认0
mybatis-plus.global-config.db-config.logic-not-delete-value=1
#逻辑删除值 默认1
mybatis-plus.global-config.db-config.logic-delete-value=0

#日志级别
logging.level.com.wanmait.mympdemo.mapper=debug

#分页插件PageHelper的设置
pagehelper.helper-dialect=mysql
pagehelper.reasonable=true

#日期格式
spring.mvc.format.date=yyyy-MM-dd
#token设置
token.secret=skdfjklsdfjksd_skdfjksdfj&sjkdfjksd$sdkfjsdikf3453456
token.expireMinutes=60

#文件上传
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.resolve-lazily=true

#redis参数设置
spring.redis.host=localhost
spring.redis.port=6379
spring.redis.password=wanmait
spring.redis.timeout=5000
spring.redis.database=0

